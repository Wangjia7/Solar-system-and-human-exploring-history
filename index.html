import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════ EVENTS DATA ═══════════
const PHYSICS_EVENTS=[{id:'p1',year:-585,title:'Thales Predicts an Eclipse',stars:3,era:'ancient',story:'The Greek philosopher Thales used the Babylonian "Saros cycle" — every 18 years and 11 days, eclipse patterns repeat — to successfully predict a solar eclipse.',insight:'Prediction is not magic — it is pattern recognition. When others see a "miracle" and you see a "cycle," you are one step closer to science.',links:['p3']},{id:'p2',year:-350,title:'Aristotle Proves Earth is Round',stars:3,era:'ancient',story:'Aristotle noticed during lunar eclipses that Earth's shadow on the Moon is always curved. He reasoned: only a sphere casts a curved shadow from every angle. This was the first time observation and logic proved Earth is round.',insight:'Great discoveries don't always need complex instruments. Sometimes all you need is to look up at the Moon and ask: why?',links:['p1','p4']},{id:'p3',year:-270,title:'Aristarchus Proposes Heliocentrism',stars:2,era:'ancient',story:'Aristarchus proposed a Sun-centered model 1,700 years before Copernicus. Using geometry, he found the Sun is far larger than Earth and reasoned the smaller should orbit the larger. But without enough data to convince others, the idea was buried for nearly two millennia.',insight:'A correct idea without supporting evidence is just a lonely seed. Science needs not only genius, but also technological maturity.',links:['p2','p7']},{id:'p4',year:-240,title:'Eratosthenes Measures the Earth',stars:3,era:'ancient',story:'The librarian of Alexandria heard that at noon on the summer solstice, sunlight reached the bottom of a well in Syene, yet obelisks in Alexandria cast shadows. He measured the shadow angle (7.2°), hired a man to pace the distance between cities, and calculated Earth's circumference within 2% error!',insight:'No satellites, no computers — just a stick, a geometric concept, and a curious mind. Mathematics turns "I guess" into "I know."',links:['p2']},{id:'p5',year:1609,title:'Kepler Discovers Elliptical Orbits',stars:3,era:'renaissance',story:'Kepler spent eight years trying to fit Mars into a circular orbit — since the Greeks, people believed "the circle is perfect." But the data was always off by 8 arcminutes. He refused to ignore this tiny error and ultimately discovered that planetary orbits are ellipses!',insight:'Eight arcminutes — small enough to ignore. But Kepler didn't. When theory and reality clash, change the theory, not the facts.',links:['p8','p6']},{id:'p6',year:1610,title:'Galileo Finds Jupiter's Moons',stars:3,era:'renaissance',story:'On January 7, 1610, Galileo pointed his homemade telescope at Jupiter and discovered three tiny "stars" moving beside it — they were orbiting Jupiter! This dealt a fatal blow to the Earth-centered model.',insight:'The telescope didn't just magnify stars — it magnified human perspective. Tools transform cognition.',links:['p5','p7']},{id:'p7',year:1687,title:'Newton Unifies Heaven and Earth',stars:3,era:'newton',story:'Newton proposed the law of universal gravitation. A single elegant formula explained both the falling apple and the orbiting Moon — heaven and earth obey the same physical laws.',insight:'Before Newton, "the heavens" and "the earth" were two separate realms. He unified them with a single equation. Simplicity tastes like truth.',links:['p5','p9','p8']},{id:'p8',year:1705,title:'Halley Predicts a Comet's Return',stars:2,era:'newton',story:'Halley used Newton's laws to calculate comet orbits and realized the comets of 1531, 1607, and 1682 were the same object. He predicted its return in 1758. He didn't live to see it — but the comet arrived on schedule.',insight:'The beauty of scientific prediction isn't "getting it right" — it's making the future calculable.',links:['p7']},{id:'p9',year:1846,title:'Neptune: Discovered by Mathematics',stars:3,era:'newton',story:'Uranus's orbit showed a small deviation from Newton's predictions. Le Verrier and Adams realized: an unknown planet must be tugging on it. They calculated its position with pure mathematics, and the Berlin Observatory found Neptune that very night.',insight:'Newtonian mechanics at its finest: predicting an invisible world with nothing but pen and paper.',links:['p8','p10','p11']},{id:'p10',year:1859,title:'Mercury's Precession: A Crack in Newton's Edifice',stars:3,era:'newton',story:'Le Verrier found Mercury's perihelion shifts ~5600 arcseconds per century. Newtonian mechanics explained 5557 — but the remaining 43 arcseconds, equivalent to viewing a coin from a kilometer away, could not be accounted for. This tiny gap became the first crack in Newton's edifice.',insight:'Real scientists don't dismiss something because "it's only a tiny difference." Those who stare at the cracks eventually push open the door to new physics.',links:['p9','p11','p12']},{id:'p11',year:1905,title:'Special Relativity',stars:3,era:'einstein',story:'A 26-year-old patent clerk named Einstein proposed that time and space are not absolute — the speed of light is. This overturned Newton's assumption of absolute space and time, opening the door to an entirely new physics.',insight:'Working at a patent office while conducting the universe's most important thought experiments. Your circumstances don't define you — your thinking does.',links:['p12']},{id:'p12',year:1915,title:'General Relativity: Gravity = Curved Spacetime',stars:3,era:'einstein',story:'Einstein spent a decade extending relativity to include gravity. The key insight: gravity is not a "force" — mass curves spacetime itself. When he applied this theory, Mercury's missing 43 arcseconds were explained perfectly!',insight:'To Newton, space was the stage. To Einstein, space itself was an actor. Sometimes a problem seems unsolvable only because we need to reframe the question entirely.',links:['p10','p11','p13']},{id:'p13',year:1919,title:'Eddington Verifies Relativity',stars:3,era:'einstein',story:'General relativity predicted that starlight bends around the Sun. The total solar eclipse of May 29, 1919 provided the test. Eddington led expeditions to Africa and Brazil to photograph the eclipse — the measured deflection matched Einstein's prediction.',insight:'Science is not decided by vote. If experiment says "yes," it is true. If experiment says "no," it is false — even if everyone believed otherwise. That is science's unique strength.',links:['p12']}];
const DISCOVERY_EVENTS=[{id:'d1',year:-2137,title:'Earliest Eclipse Record',stars:2,era:'ancient',story:'The Chinese classic "Book of Documents" records what is humanity's earliest known eclipse: "On the first day of the last month of autumn, the Sun and Moon did not meet harmoniously." People believed a celestial dragon was devouring the Sun and banged drums to scare it away.',insight:'Recording is the first step of all science. Even without understanding, faithfully writing down what you observe is the most precious gift to the future.',links:[]},{id:'d2',year:1543,title:'Copernicus: On the Revolutions',stars:3,era:'renaissance',story:'In 1543, on his deathbed, Copernicus published "On the Revolutions of the Heavenly Spheres," placing the Sun at the center. He was the first to demonstrate with detailed mathematics that a heliocentric model is simpler than a geocentric one.',insight:'Sometimes we don't believe the truth because we "saw it" — we believe it because we dared to look from a different angle.',links:[]},{id:'d3',year:1576,title:'Tycho Brahe's Star Catalog',stars:2,era:'renaissance',story:'Before the telescope, Tycho Brahe made the most precise naked-eye astronomical observations in history using giant quadrants — recording planetary positions nightly with errors under 1 arcminute. This data later proved essential for Kepler's discoveries.',insight:'A scientist isn't always the one who proposes the theory. Tycho spent thirty years faithfully recording data — being a solid foundation is just as noble.',links:[]},{id:'d4',year:1781,title:'Herschel Discovers Uranus',stars:2,era:'newton',story:'Amateur astronomer Herschel was scanning the sky with his homemade telescope when he noticed a "curious star-like point." Mathematicians confirmed it — a new planet! The solar system's boundaries expanded for the first time in recorded history.',insight:'Science doesn't always happen in expensive labs — sometimes it happens in the backyard of a curious person.',links:[]},{id:'d5',year:1957,title:'Sputnik: Entering Space',stars:2,era:'space',story:'On October 4, 1957, the Soviet Union launched humanity's first artificial satellite, Sputnik 1. It was the size of a basketball and could only broadcast beeping signals — but it announced the arrival of the Space Age.',insight:'From stone axes to satellites — our tools grow further from our bodies but closer to our imagination. Sputnik proved: we can.',links:[]},{id:'d6',year:1969,title:'Apollo 11 Lands on the Moon',stars:3,era:'space',story:'On July 20, 1969, Neil Armstrong left humanity's first footprint on the lunar surface. "That's one small step for a man, one giant leap for mankind."',insight:'From Aristotle deducing Earth's roundness during a lunar eclipse to Armstrong standing on the Moon looking back at Earth — humanity walked for 2,300 years.',links:[]},{id:'d7',year:1977,title:'Voyager: The Grand Tour',stars:3,era:'space',story:'Voyager 1 and 2 took advantage of a once-in-a-century planetary alignment to visit Jupiter, Saturn, Uranus, and Neptune in a single journey. They are still flying away from the solar system, carrying a "Golden Record" of human civilization.',insight:'We launched it knowing it would never return. The meaning of scientific exploration is sometimes simply: because we can ask.',links:[]},{id:'d8',year:1990,title:'Hubble Space Telescope',stars:2,era:'space',story:'Hubble was launched into orbit, freed from atmospheric distortion, showing us a universe of unprecedented clarity. Every image rewrites the textbooks.',insight:'Sometimes progress doesn't come from being smarter — it comes from finding a better vantage point to see the problem.',links:[]},{id:'d9',year:2006,title:'Pluto Reclassified as a Dwarf Planet',stars:2,era:'space',story:'In 2006, the IAU redefined "planet": it must orbit the Sun, be spherical, and have "cleared" its orbital neighborhood. Pluto failed criterion three — it was reclassified as a "dwarf planet."',insight:'Scientific definitions are not eternal. When new evidence emerges, they can be revised — this isn't flip-flopping, it's describing reality more precisely.',links:[]}];

function createBelt(iA,oA,cnt,clr){const g=new THREE.BufferGeometry();const ps=new Float32Array(cnt*3);const cs=new Float32Array(cnt*3);const bc=new THREE.Color(clr);for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2;const r=iA+Math.random()*(oA-iA);ps[i*3]=Math.cos(a)*r;ps[i*3+1]=(Math.random()-.5)*(oA-iA)*.08;ps[i*3+2]=Math.sin(a)*r;const c=bc.clone();c.offsetHSL(0,0,(Math.random()-.5)*.1);cs[i*3]=c.r;cs[i*3+1]=c.g;cs[i*3+2]=c.b}g.setAttribute('position',new THREE.BufferAttribute(ps,3));g.setAttribute('color',new THREE.BufferAttribute(cs,3));const p=new THREE.Points(g,new THREE.PointsMaterial({size:.1,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.6}));p.visible=false;scene.add(p);return p}

// ═══════════ ORBIT MATH ═══════════
function solveKepler(M,e,tol=1e-8){let E=M;for(let i=0;i<20;i++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<tol)break}return E}
function ellipticalPos(a,e,periArg,M){const E=solveKepler(M,e),cE=Math.cos(E),sE=Math.sin(E);const x0=a*(cE-e),z0=a*Math.sqrt(1-e*e)*sE;const cp=Math.cos(periArg),sp=Math.sin(periArg);return{x:x0*cp-z0*sp,z:x0*sp+z0*cp}}

// ═══════════ ORBIT LINE DRAWING ═══════════
function drawOrbitLine(line,a,e,periArg,segments=256){
  const pts=[];for(let i=0;i<=segments;i++){const M=i/segments*Math.PI*2;let x,z;if(e<.001||!ellipticalOrbit){x=Math.cos(M)*a;z=Math.sin(M)*a}else{const pos=ellipticalPos(a,e,periArg,M);x=pos.x;z=pos.z}pts.push(x,0,z)}
  line.geometry.dispose();line.geometry=new THREE.BufferGeometry();line.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
}
function updateAllOrbitLines(){orbitLines.forEach(ol=>drawOrbitLine(ol.line,ol.au*getAU(),ol.ecc,ol.periArg));}

// ═══════════ SCALE ═══════════
function getAU(){return scaleMode==='realDist'?REAL_AU:ARTISTIC_AU}
function getPlanetScale(bs){return scaleMode==='realSize'?bs*REAL_SUN_RADIUS/109.3:Math.pow(bs,.5)*1.5}
function updateOrbitLineStyle(){
  const planetColors=[0xb0a090,0xe8c860,0x4da6ff,0xd04030,0xd4b896,0xe8d5a0,0x8ec8d8,0x4060c0];
  orbitLines.forEach((ol,i)=>{

      ol.line.material.opacity=.7;
    }else{
      ol.line.material.color.set(0x335577);
      ol.line.material.opacity=.4;
    }
  });
}
function applyScale(){
  const au=getAU();sun.scale.setScalar(5);glowSpr.scale.set(8,8,1);outerGlow.scale.set(18,18,1);
  planets.forEach(p=>{p.currentSize=getPlanetScale(p.size);p.group.scale.setScalar(p.currentSize);p.currentAu=p.au*au});
  updateAllOrbitLines();updateOrbitLineStyle();
  updateBeltScale(mainBelt,2.1*au,3.3*au);updateBeltScale(kuiperBelt,30*au,50*au);
  const es=getPlanetScale(1),md=scaleMode==='realDist'?.00257*au:1.2;moonTiltGrp.scale.setScalar(Math.max(md,es*.5));
}
function updateBeltScale(pts,iR,oR){if(!pts)return;const a=pts.geometry.attributes.position.array,c=a.length/3;for(let i=0;i<c;i++){const ang=Math.atan2(a[i*3+2],a[i*3]),nr=iR+Math.random()*(oR-iR);a[i*3]=Math.cos(ang)*nr;a[i*3+2]=Math.sin(ang)*nr;a[i*3+1]=(Math.random()-.5)*(oR-iR)*.08}pts.geometry.attributes.position.needsUpdate=true}

// ═══════════ POSITIONS ═══════════
function updatePlanetPositions(){
  const years=(simTime-EPOCH)/MS_PER_YEAR;
  planets.forEach(p=>{const n=2*Math.PI*years/p.period;let pos;if(ellipticalOrbit)pos=ellipticalPos(p.currentAu,p.ecc,p.data.periArg||0,n);else pos={x:Math.cos(p.angle+n)*p.currentAu,z:Math.sin(p.angle+n)*p.currentAu};p.group.position.set(pos.x,0,pos.z);p.group.rotation.y=Math.atan2(pos.z,pos.x)+Math.PI/2;if(!showOrbits){const wp=p.group.getWorldPosition(new THREE.Vector3()),d=camera.position.distanceTo(wp);p.orbitLine.material.opacity=THREE.MathUtils.clamp(.1+.15*(1-d/300),.06,.35)}});
  const moonPeriodYears=27.322/365.25;moonOrbitGrp.rotation.y=2*Math.PI*(years/moonPeriodYears);
}

// ═══════════ DETECTION ═══════════
function detectAlignments(){const angles=planets.map(p=>{const wp=p.group.getWorldPosition(new THREE.Vector3()),sp=sun.getWorldPosition(new THREE.Vector3()),rel=wp.clone().sub(sp);return Math.atan2(rel.z,rel.x)});const sorted=angles.map((a,i)=>({a,i})).sort((x,y)=>x.a-y.a);const threshold=Math.PI*8/180;for(let s=0;s<sorted.length;s++){const cl=[sorted[s].i];let maxA=sorted[s].a;for(let j=1;j<sorted.length;j++){const idx=(s+j)%sorted.length;let diff=sorted[idx].a-sorted[s].a;if(diff<0)diff+=2*Math.PI;if(diff<threshold){cl.push(sorted[idx].i);if(sorted[idx].a>maxA)maxA=sorted[idx].a}else break}if(cl.length>=3){const spread=((maxA-sorted[s].a)+2*Math.PI)%(2*Math.PI);if(spread<threshold)return[cl]}}return[]}
function detectEclipses(){if(!showMoon)return null;const sp=sun.getWorldPosition(new THREE.Vector3()),ep=planets[2].group.getWorldPosition(new THREE.Vector3()),mp=new THREE.Vector3();moonMesh.getWorldPosition(mp);const ets=sp.clone().sub(ep).normalize(),etm=mp.clone().sub(ep).normalize(),angle=Math.acos(THREE.MathUtils.clamp(ets.dot(etm),-1,1));if(angle<Math.PI/24){const md=mp.distanceTo(ep),sd=sp.distanceTo(ep);return md<sd?'solar':'lunar'}return null}
function getPosAtYear(p,year){const n=2*Math.PI*year/p.period;if(ellipticalOrbit){const pos=ellipticalPos(p.currentAu,p.ecc,p.data.periArg||0,n);return{x:pos.x,z:pos.z}}return{x:Math.cos(p.angle+n)*p.currentAu,z:Math.sin(p.angle+n)*p.currentAu}}
function predictNextEvent(type,maxY=300){const cy=1+(simTime-EPOCH)/MS_PER_YEAR;const th=Math.PI*8/180;
  for(let dy=.03;dy<=maxY;dy+=.03){const ty=cy+dy;
    if(type==='alignment'){const angles=planets.map((p,i)=>{const pos=getPosAtYear(p,ty);return{a:Math.atan2(pos.z,pos.x),i}}).sort((x,y)=>x.a-y.a);
      for(let s=0;s<angles.length;s++){const cl=[angles[s].i];let ma=angles[s].a;
        for(let j=1;j<angles.length;j++){const idx=(s+j)%angles.length;let d=angles[idx].a-angles[s].a;if(d<0)d+=2*Math.PI;if(d<th){cl.push(angles[idx].i);if(angles[idx].a>ma)ma=angles[idx].a}else break}
        if(cl.length>=3){const sp=((ma-angles[s].a)+2*Math.PI)%(2*Math.PI);if(sp<th)return{years:dy,count:cl.length}}}}
    }else if(type==='eclipse'){if(!showMoon)return null;
      const ep=getPosAtYear(planets[2],ty);const ea=Math.atan2(ep.z,ep.x)+Math.PI/2;
      const mpY=27.322/365.25;const mp=2*Math.PI*(ty/mpY);const mR=1.2*moonTiltGrp.scale.x;const inc=5.145*Math.PI/180;
      const mLx=Math.cos(mp)*mR,mLy=-Math.sin(mp)*Math.sin(inc)*mR,mLz=Math.sin(mp)*Math.cos(inc)*mR;
      const cE=Math.cos(ea),sE=Math.sin(ea);
      const mWx=mLx*cE-mLz*sE+ep.x,mWz=mLx*sE+mLz*cE+ep.z,mWy=mLy;
      const sdx=0-ep.x,sdz=0-ep.z,mdx=mWx-ep.x,mdz=mWz-ep.z;
      const sa=Math.atan2(sdz,sdx),ma=Math.atan2(mdz,mdx);let ad=Math.abs(ma-sa);if(ad>Math.PI)ad=2*Math.PI-ad;
      if(ad<Math.PI/20&&Math.abs(mWy)<mR*Math.sin(inc)*.4){const emd=Math.sqrt(mdx*mdx+mdz*mdz+mWy*mWy),esd=Math.sqrt(sdx*sdx+sdz*sdz);return{years:dy,type:emd<esd?'solar':'lunar'}}}}
  }return null}
const ALIGN_NAMES={3:'Triple Conjunction',4:'Quadruple Conjunction',5:'Quintuple Conjunction',6:'Sextuple Conjunction',7:'Septuple Conjunction',8:'Octuple Conjunction'}

function triggerShowcase(type,data){paused=true;showcaseMarkers.forEach(m=>{if(m.parent)m.parent.remove(m);if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()});showcaseMarkers.length=0;const overlay=document.getElementById('showcaseOverlay'),title=document.getElementById('showcaseTitle'),sub=document.getElementById('showcaseSub');
  if(type==='alignment'){const indices=data,aname=ALIGN_NAMES[indices.length]||(indices.length+'-planet conjunction'),names=indices.map(i=>planets[i].data.name).join(' · ');title.textContent='🪐 '+aname;const pred=predictNextEvent('alignment');const predTxt=pred?'Next alignment in ~'+Math.round(pred.years)+' years':'No alignment soon';sub.innerHTML=names+'<br><span style="font-size:12px;opacity:.6">'+predTxt+'</span>';indices.forEach(i=>{const p=planets[i];const ring=new THREE.Mesh(new THREE.TorusGeometry(p.currentSize*2.2,.15,16,32),new THREE.MeshBasicMaterial({color:0xffcc00,transparent:true,opacity:.9,depthTest:false,depthWrite:false}));ring.renderOrder=999;ring.material.depthTest=false;p.group.add(ring);showcaseMarkers.push(ring);const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:makeTex(128,128,(ctx,w,h)=>{const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);g.addColorStop(0,'rgba(255,200,50,.6)');g.addColorStop(.5,'rgba(255,150,20,.15)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}),blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false}));spr.scale.set(p.currentSize*6,p.currentSize*6,1);spr.renderOrder=998;p.group.add(spr);showcaseMarkers.push(spr)});if(indices.length>=2){const pts=indices.map(i=>planets[i].group.getWorldPosition(new THREE.Vector3()));const lGeo=new THREE.BufferGeometry().setFromPoints(pts);const line=new THREE.Line(lGeo,new THREE.LineBasicMaterial({color:0xffcc00,transparent:true,opacity:.6,depthTest:false,depthWrite:false}));line.renderOrder=997;scene.add(line);showcaseMarkers.push(line)}}
  else if(type==='eclipse'){const et=data;title.textContent=et==='solar'?'🌑 Solar Eclipse':'🌕 Lunar Eclipse';const pred=predictNextEvent('eclipse');const predTxt=pred?'Next '+(pred.type==='solar'?'solar':'lunar')+' eclipse in ~'+Math.round(pred.years)+' years':'No eclipse soon';const baseTxt=et==='solar'?'The Moon passes between the Sun and Earth':'Earth's shadow falls upon the Moon';sub.innerHTML=baseTxt+'<br><span style="font-size:12px;opacity:.6">'+predTxt+'</span>';[2].forEach(i=>{const p=planets[i];const ring=new THREE.Mesh(new THREE.TorusGeometry(p.currentSize*2.2,.15,16,32),new THREE.MeshBasicMaterial({color:0xff8844,transparent:true,opacity:.9,depthTest:false,depthWrite:false}));ring.renderOrder=999;ring.material.depthTest=false;p.group.add(ring);showcaseMarkers.push(ring)});const mSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:makeTex(128,128,(ctx,w,h)=>{const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);g.addColorStop(0,'rgba(255,180,80,.7)');g.addColorStop(.5,'rgba(255,120,30,.2)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}),blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false}));mSpr.scale.set(5,5,1);mSpr.renderOrder=998;moonMesh.add(mSpr);showcaseMarkers.push(mSpr)}
  overlay.classList.add('active');showcase={timer:4.5};showToast(title.textContent+' — paused for showcase')}
function clearShowcase(){showcaseMarkers.forEach(m=>{if(m.parent)m.parent.remove(m);if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()});showcaseMarkers.length=0;document.getElementById('showcaseOverlay').classList.remove('active');showcase=null;paused=false}

// ═══════════ HISTORICAL EVENTS ═══════════
const allEvents=[...PHYSICS_EVENTS.map(e=>({...e,category:'physics'})),...DISCOVERY_EVENTS.map(e=>({...e,category:'discovery'}))];allEvents.sort((a,b)=>a.year-b.year);const eventNotified=new Set();
function checkHistoricalEvents(){const simYear=1+(simTime-EPOCH)/MS_PER_YEAR;allEvents.forEach(ev=>{if(!eventNotified.has(ev.id)&&ev.year<=simYear){eventNotified.add(ev.id);triggerEvent(ev)}})}
function triggerEvent(ev){const badge=document.getElementById('notifBadge');badge.textContent=`📜 ${ev.title}`;badge.classList.add('show');badge.onclick=()=>{openTimeline();scrollToEvent(ev.id);badge.classList.remove('show')};showToast(`📜 Historical: ${ev.title}`);setTimeout(()=>badge.classList.remove('show'),12000)}

// ═══════════ TIMELINE UI ═══════════
const eraColors={ancient:'var(--era1)',renaissance:'var(--era2)',newton:'var(--era3)',einstein:'var(--era4)',space:'var(--era5)'};
const eraNames={ancient:'Ancient World',renaissance:'Renaissance',newton:'Newtonian Era',einstein:'Einstein Era',space:'Space Age'};
const sd3=s=>'★'.repeat(s)+'☆'.repeat(3-s);
function renderEventList(events,containerId){const list=document.getElementById(containerId);list.innerHTML='';let ce='';events.forEach(ev=>{if(ev.era!==ce){ce=ev.era;const h=document.createElement('div');h.style.cssText=`font-size:12px;font-weight:600;color:${eraColors[ce]};padding:8px 0 4px;border-bottom:1px solid var(--border);margin-top:2px`;h.textContent=eraNames[ce]||ce;list.appendChild(h)}const card=document.createElement('div');card.className='event-card';card.id='ev-'+ev.id;const yStr=ev.year<0?`${Math.abs(ev.year)} BCE`:`${ev.year} CE`;card.innerHTML=`<div class="era-dot" style="background:${eraColors[ev.era]}"></div><div class="ev-header"><span class="ev-year">${yStr}</span><span class="ev-title">${ev.title}</span><span class="ev-stars">${sd3(ev.stars)}</span></div><div class="ev-body">${ev.story}</div><div class="ev-insight">💡 ${ev.insight}</div><div class="ev-links">Related: ${(ev.links||[]).map(cid=>{const ce=allEvents.find(e=>e.id===cid);return ce?ce.title:cid}).join(' → ')||'none'}</div>`;card.addEventListener('click',()=>{const was=card.classList.contains('expanded');list.querySelectorAll('.event-card').forEach(c=>c.classList.remove('expanded'));if(!was)card.classList.add('expanded')});list.appendChild(card)})}
function openTimeline(){document.getElementById('timelinePanel').classList.add('open');document.getElementById('timelineBtn').style.left='458px'}
function closeTimeline(){document.getElementById('timelinePanel').classList.remove('open');document.getElementById('timelineBtn').style.left='8px'}
function scrollToEvent(id){const c=document.getElementById('ev-'+id);if(c)c.scrollIntoView({behavior:'smooth',block:'center'})}

// ═══════════ CAMERA FOLLOW ═══════════
function setFollowTarget(obj){followTarget=obj;followLerp=0;if(obj){showToast(`📷 Following ${obj.data.name}`);controls.dampingFactor=.15}else{showToast('🌌 Overview');controls.dampingFactor=.08;camTargetLook.set(0,0,0)}}
function updateFollowCamera(dt){if(!followTarget){if(camTargetLook.length()>.001)controls.target.lerp(camTargetLook,Math.min(CAM_LERP_SPEED*dt,1));return}followLerp=Math.min(followLerp+CAM_LERP_SPEED*dt,1);const pos=followTarget.group.getWorldPosition(new THREE.Vector3()),size=followTarget.currentSize,cd=size*8+5,t=Date.now()*.0001,off=new THREE.Vector3(Math.cos(t)*cd,cd*.4,Math.sin(t)*cd);camTargetPos.copy(pos).add(off);camTargetLook.copy(pos);camera.position.lerp(camTargetPos,Math.min(CAM_LERP_SPEED*dt,1));controls.target.lerp(camTargetLook,Math.min(CAM_LERP_SPEED*dt,1));controls.update()}

// ═══════════ INTRO ANIMATION ═══════════
function updateIntro(dt){
  if(!introActive)return;
  introProgress+=dt;
  const totalDuration=4.5;
  const t=Math.min(introProgress/totalDuration,1);
  // Ease-out cubic
  const ease=1-Math.pow(1-t,3);
  // Camera starts far above, flies in toward the solar system
  const startDist=400,startY=300;
  const endPos=new THREE.Vector3(25,35,50);
  const startPos=new THREE.Vector3(0,startY,-startDist);
  camera.position.lerpVectors(startPos,endPos,ease);
  controls.target.set(0,0,0);
  if(t>=1){introActive=false;controls.enabled=true;controls.autoRotate=true;controls.autoRotateSpeed=.3;document.getElementById('introOverlay').classList.add('fade');
    setTimeout(()=>{const el=document.getElementById('introOverlay');if(el)el.remove()},1000);showToast('☀ Welcome — explore the Solar System')}
}

// ═══════════ UI ═══════════
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),2500)}
function formatDate(ms){const daysSince=(ms-EPOCH)/MS_PER_DAY;const year=1+daysSince/365.25;if(year>=1)return`${Math.floor(year)} CE`;else return`${Math.floor(Math.abs(year))+1} BCE`}

const rightPanel=document.getElementById('rightPanel');
planets.forEach(p=>{const b=document.createElement('div');b.className='pnav';b.style.background=`#${p.data.color.toString(16).padStart(6,'0')}33`;b.innerHTML=p.data.emoji;const tt=document.createElement('span');tt.className='tt';tt.textContent=p.data.name;b.appendChild(tt);b.addEventListener('click',()=>setFollowTarget(p));rightPanel.appendChild(b)});

const labelDivs=[];
planets.forEach(p=>{const d=document.createElement('div');d.className='planet-label';d.textContent=p.data.name;document.body.appendChild(d);labelDivs.push({div:d,planet:p})});
function updateLabels(){labelDivs.forEach(({div,planet})=>{const pos=planet.group.getWorldPosition(new THREE.Vector3());pos.project(camera);div.style.left=(pos.x*.5+.5)*innerWidth+'px';div.style.top=(-pos.y*.5+.5)*innerHeight-planet.currentSize*15-10+'px';div.style.opacity=pos.z>1?'0':(followTarget===planet?'1':'.6')})}

const ts=document.getElementById('timeSlider'),td=document.getElementById('timeDisplay'),rl=document.getElementById('rateLabel');
function updateTimeDisplay(){td.textContent=formatDate(simTime);const year=1+(simTime-EPOCH)/MS_PER_YEAR;ts.value=Math.round((((year%2000+2000)%2000)/2000)*1000)}
function updateRateLabel(){rl.textContent=timeRate.toFixed(timeRate<1?2:0)+'×'}
document.getElementById('btnPause').addEventListener('click',function(){paused=!paused;this.textContent=paused?'▶':'⏸'});
document.getElementById('btnFwd').addEventListener('click',()=>{timeRate=Math.min(timeRate*2,102400);updateRateLabel()});
document.getElementById('btnRew').addEventListener('click',()=>{timeRate=timeRate>0?Math.max(timeRate/2,-102400):Math.min(timeRate*2,-.015625);updateRateLabel()});
ts.addEventListener('input',()=>{const f=parseInt(ts.value)/1000;simTime=EPOCH+f*2000*MS_PER_YEAR;updateTimeDisplay()});

function updateModeButtons(){['btnArtistic','btnRealDist','btnRealSize'].forEach(id=>document.getElementById(id).classList.remove('active'));if(scaleMode==='artistic')document.getElementById('btnArtistic').classList.add('active');else if(scaleMode==='realDist')document.getElementById('btnRealDist').classList.add('active');else document.getElementById('btnRealSize').classList.add('active')}
document.getElementById('btnArtistic').addEventListener('click',()=>{scaleMode='artistic';updateModeButtons();applyScale();updatePlanetPositions();if(!followTarget){camera.position.set(25,35,50);controls.target.set(0,0,0);controls.update()}showToast('🎨 Observe Mode')});
document.getElementById('btnRealDist').addEventListener('click',()=>{scaleMode='realDist';updateModeButtons();applyScale();updatePlanetPositions();if(!followTarget){camera.position.set(300,200,500);controls.target.set(0,0,0);controls.update()}showToast('📏 Real Distance Scale')});
document.getElementById('btnRealSize').addEventListener('click',()=>{scaleMode='realSize';updateModeButtons();applyScale();updatePlanetPositions();if(!followTarget){camera.position.set(25,35,50);controls.target.set(0,0,0);controls.update()}showToast('📐 Real Size Scale')});
document.getElementById('btnEllipse').addEventListener('click',function(){ellipticalOrbit=!ellipticalOrbit;this.classList.toggle('active',ellipticalOrbit);updateAllOrbitLines();updateOrbitLineStyle();showToast(ellipticalOrbit?'🔵 Elliptical — orbit lines updated':'⭕ Circular — orbit lines restored')});
document.getElementById('btnOrbitViz').addEventListener('click',function(){showOrbits=!showOrbits;this.classList.toggle('active',showOrbits);updateOrbitLineStyle();updateAllOrbitLines();showToast(showOrbits?'🎨 Orbit Viz — colored lines on':'Orbit Viz — off')});
document.getElementById('btnMoon').addEventListener('click',function(){showMoon=!showMoon;this.classList.toggle('active',showMoon);moonTiltGrp.visible=showMoon;showToast(showMoon?'🌙 Moon — visible':'Moon — hidden')});
document.getElementById('btnAsteroids').addEventListener('click',function(){showAsteroids=!showAsteroids;this.classList.toggle('active',showAsteroids);mainBelt.visible=showAsteroids});
document.getElementById('btnKuiper').addEventListener('click',function(){showKuiper=!showKuiper;this.classList.toggle('active',showKuiper);kuiperBelt.visible=showKuiper});
document.getElementById('btnCoord').addEventListener('click',function(){showCoord=!showCoord;this.classList.toggle('active',showCoord);coordGrid.visible=showCoord;coordAxes.visible=showCoord;showToast(showCoord?'📍 Axes — visible':'Axes — hidden')});
document.getElementById('timelineBtn').addEventListener('click',()=>{const p=document.getElementById('timelinePanel');p.classList.contains('open')?closeTimeline():openTimeline()});
// Single timeline tab — no tab switching needed

const raycaster=new THREE.Raycaster();raycaster.params.Points.threshold=2;
let clickTime=0,mDown=false,mMoved=false;
renderer.domElement.addEventListener('pointerdown',()=>{mDown=true;mMoved=false});
renderer.domElement.addEventListener('pointermove',()=>{if(mDown)mMoved=true});
renderer.domElement.addEventListener('pointerup',e=>{if(mMoved){mDown=false;return}mDown=false;const m=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(m,camera);const is=raycaster.intersectObjects(planets.map(p=>p.mesh));const now=Date.now();if(is.length>0){const obj=is[0].object,p=planets.find(pp=>pp.mesh===obj||pp.group.children.includes(obj));if(p){setFollowTarget(p);clickTime=now}}else{if(now-clickTime<350)setFollowTarget(null);clickTime=now}});

window.addEventListener('keydown',e=>{switch(e.key.toLowerCase()){case' ':e.preventDefault();document.getElementById('btnPause').click();break;case'escape':setFollowTarget(null);if(showcase)clearShowcase();break;case'1':scaleMode='artistic';updateModeButtons();applyScale();updatePlanetPositions();break;case'2':scaleMode='realDist';updateModeButtons();applyScale();updatePlanetPositions();break;case'3':scaleMode='realSize';updateModeButtons();applyScale();updatePlanetPositions();break;case'a':document.getElementById('btnAsteroids').click();break;case'k':document.getElementById('btnKuiper').click();break;case'h':document.getElementById('btnCoord').click();break;case'e':document.getElementById('btnEllipse').click();break;case'o':document.getElementById('btnOrbitViz').click();break;case'm':document.getElementById('btnMoon').click();break;case't':openTimeline();break;case'arrowright':timeRate=Math.min(timeRate*2,102400);updateRateLabel();break;case'arrowleft':timeRate=timeRate>0?Math.max(timeRate/2,-102400):Math.min(timeRate*2,-.015625);updateRateLabel();break}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

// ═══════════ ANIMATION ═══════════
let lastTime=performance.now(),alignTimer=0,eclipseTimer=0,eventTimer=0;
function animate(ts2){requestAnimationFrame(animate);let dt=(ts2-lastTime)/1000;lastTime=ts2;if(dt>.1)dt=.1;
  if(introActive){updateIntro(dt);composer.render();return}
  if(showcase){showcase.timer-=dt;if(showcase.timer<=0)clearShowcase()}
  if(!paused&&!showcase){simTime+=dt*timeRate*MS_PER_DAY;updateTimeDisplay()}
  updatePlanetPositions();updateFollowCamera(dt);updateLabels();
  if(!showcase&&!introActive){
    alignTimer+=dt;if(alignTimer>3){alignTimer=0;const cl=detectAlignments();if(cl.length>0)triggerShowcase('alignment',cl[0])}
    eclipseTimer+=dt;if(eclipseTimer>3){eclipseTimer=0;const ec=detectEclipses();if(ec)triggerShowcase('eclipse',ec)}
    eventTimer+=dt;if(eventTimer>3){eventTimer=0;checkHistoricalEvents()}
  }
  if(!followTarget||followLerp<.9)controls.update();
  composer.render();
}

applyScale();updatePlanetPositions();updateTimeDisplay();updateRateLabel();
renderEventList(allEvents.filter(e=>e.category!=='__none__'),'tab-history');
console.log('☀ Solar System · Physics Explorer');
console.log('  E:Elliptical | O:Orbit Viz | M:Moon | H:Axes | T:History | Space:Pause');
console.log('  Free interaction after intro animation');
animate(performance.now());
</script>
